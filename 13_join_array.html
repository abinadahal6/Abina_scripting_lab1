<!DOCTYPE html>
<html>
<head>
    <title>Join Array</title>
</head>
<body>

<h2>Join Array Elements</h2>
<p id="output"></p>

<script>
let colors = ["Red", "Green", "Blue", "Yellow"];

let result = colors.join(", ");

output.innerHTML =
    "Array: " + colors + "<br>" +
    "Joined String: " + result;
</script>

</body>
</html>
