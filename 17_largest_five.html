<!DOCTYPE html>
<html>
<head>
    <title>Largest of Five Numbers</title>
</head>
<body>

<h2>Largest of Five Numbers</h2>
<p id="output"></p>

<script>
let a = Number(prompt("Enter first number:"));
let b = Number(prompt("Enter second number:"));
let c = Number(prompt("Enter third number:"));
let d = Number(prompt("Enter fourth number:"));
let e = Number(prompt("Enter fifth number:"));

let largest = Math.max(a, b, c, d, e);

output.innerHTML = "Largest Number: " + largest;

alert("Largest Number is: " + largest);
</script>

</body>
</html>
