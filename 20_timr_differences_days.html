<!DOCTYPE html>
<html>
<head>
    <title>Time Difference</title>
</head>
<body>

<h2>Time Difference in Days</h2>
<p id="output"></p>

<script>
function timeDifference(date1, date2) {
    let d1 = new Date(date1);
    let d2 = new Date(date2);

    let difference = Math.abs(d2 - d1);

    return difference / (1000 * 60 * 60 * 24);
}

let date1 = "2026-08-05";
let date2 = "2026-08-15";

output.innerHTML =
    "First Date: " + date1 + "<br>" +
    "Second Date: " + date2 + "<br>" +
    "Time Difference: " + timeDifference(date1, date2) + " days";
</script>

</body>
</html>
