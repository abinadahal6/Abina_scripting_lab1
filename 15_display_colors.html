<!DOCTYPE html>
<html>
<head>
    <title>Color Choices</title>
</head>
<body>

<h2>Color Choices</h2>
<p id="output"></p>

<script>
let color = ["Blue", "Green", "Red", "Orange",
             "Violet", "Indigo", "Yellow"];

let result = "";

for (let i = 0; i < color.length; i++) {
    let n = i + 1;
    let suffix = "th";

    if (n == 1) suffix = "st";
    else if (n == 2) suffix = "nd";
    else if (n == 3) suffix = "rd";

    result += n + suffix + " choice is " + color[i] + "<br>";
}

output.innerHTML = result;
</script>

</body>
</html>
