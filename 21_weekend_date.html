<!DOCTYPE html>
<html>
<head>
    <title>Weekend Date</title>
</head>
<body>

<h2>Weekend Date</h2>
<p id="output"></p>

<script>
function getWeekendDate() {
    let today = new Date();
    let day = today.getDay();

    let saturday = new Date(today);
    saturday.setDate(today.getDate() + (6 - day));

    return saturday.toDateString();
}

output.innerHTML = "Weekend Date: " + getWeekendDate();
</script>

</body>
</html>
