<!DOCTYPE html>
<html>
<head>
    <title>Date Difference</title>
</head>
<body>

<h2>Difference Between Two Dates</h2>
<p id="output"></p>

<script>
function dateDifference(date1, date2) {
    let d1 = new Date(date1);
    let d2 = new Date(date2);

    return Math.abs(d2 - d1) / (1000 * 60 * 60 * 24);
}

let date1 = "2026-08-01";
let date2 = "2026-08-10";

output.innerHTML =
    "Date 1: " + date1 + "<br>" +
    "Date 2: " + date2 + "<br>" +
    "Difference: " + dateDifference(date1, date2) + " days";
</script>

</body>
</html>
