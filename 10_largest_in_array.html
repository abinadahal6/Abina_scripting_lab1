<!DOCTYPE html>
<html>
<head>
    <title>Largest Number</title>
</head>
<body>

<h2>Largest Number in Array</h2>
<p id="output"></p>

<script>
let numbers = [];
let n = Number(prompt("How many numbers?"));

for (let i = 0; i < n; i++) {
    numbers.push(Number(prompt("Enter number " + (i + 1) + ":")));
}

let largest = Math.max(...numbers);

output.innerHTML =
    "Numbers: " + numbers.join(", ") + "<br>" +
    "Largest Number: " + largest;
</script>

</body>
</html>
