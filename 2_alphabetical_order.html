<!DOCTYPE html>
<html>
<head>
    <title>Count Vowels</title>
</head>
<body>

<h2>Count Vowels</h2>
<p id="output"></p>

<script>
function countVowels(str) {
    let count = 0;

    for (let i = 0; i < str.length; i++) {
        if ("aeiouAEIOU".includes(str[i])) {
            count++;
        }
    }

    return count;
}

let text = "JavaScript";

output.innerHTML = "String: " + text + "<br>" +
                   "Number of Vowels: " + countVowels(text);
</script>

</body>
</html>
