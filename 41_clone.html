<!DOCTYPE html>
<html>
<head>
    <title>Clone and Remove Row</title>

    <style>
        body {
            font-family: Arial;
            margin: 30px;
        }

        table {
            width: 700px;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
        }

        th {
            background-color: lightgray;
        }

        input, select {
            padding: 6px;
            width: 90%;
        }

        button {
            padding: 7px 12px;
            cursor: pointer;
        }

        .delete {
            background-color: red;
            color: white;
            border: none;
        }

        #add {
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <h2>Duplicate / Clone Rows using JavaScript</h2>

    <table id="productTable">

        <thead>
            <tr>
                <th>No</th>
                <th>Product</th>
                <th>Price</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="tableBody">

            <tr>
                <td>1</td>

                <td>
                    <select>
                        <option>Select Product</option>
                        <option>Laptop</option>
                        <option>Mobile</option>
                        <option>Keyboard</option>
                        <option>Mouse</option>
                    </select>
                </td>

                <td>
                    <input type="number">
                </td>

                <td>
                    <button class="delete"
                            onclick="deleteRow(this)">
                        🗑
                    </button>
                </td>
            </tr>

        </tbody>

    </table>

    <button id="add" onclick="addRow()">Add New</button>

    <script>

        function addRow() {

            let tableBody =
                document.getElementById("tableBody");

            let firstRow =
                tableBody.querySelector("tr");

            let newRow =
                firstRow.cloneNode(true);

            let rowNumber =
                tableBody.rows.length + 1;

            newRow.cells[0].innerHTML = rowNumber;

            newRow.querySelector("select").selectedIndex = 0;

            newRow.querySelector("input").value = "";

            tableBody.appendChild(newRow);
        }


        function deleteRow(button) {

            let row = button.closest("tr");

            row.remove();

            updateNumbers();
        }


        function updateNumbers() {

            let rows =
                document.querySelectorAll("#tableBody tr");

            rows.forEach(function(row, index) {

                row.cells[0].innerHTML = index + 1;

            });
        }

    </script>

</body>
</html>
