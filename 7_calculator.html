<!DOCTYPE html>
<html>
<head>
    <title>Arithmetic Operations</title>
</head>
<body>

<h2>Arithmetic Operations</h2>
<p id="output"></p>

<script>
let a = Number(prompt("Enter first number:"));
let b = Number(prompt("Enter second number:"));

output.innerHTML =
    "First Number: " + a + "<br>" +
    "Second Number: " + b + "<br><br>" +
    "Addition: " + (a + b) + "<br>" +
    "Subtraction: " + (a - b) + "<br>" +
    "Multiplication: " + (a * b) + "<br>" +
    "Division: " + (a / b);
</script>

</body>
</html>
